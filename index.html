<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiCompress - Client-Side File Compressor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Client-side PDF manipulation -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- Client-side ZIP creation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">

  <header class="max-w-4xl w-full text-center my-8">
    <h1 class="text-4xl font-extrabold text-indigo-400 mb-2">OptiCompress Pro</h1>
    <p class="text-slate-400">Compress JPG, PNG, JPEG, and PDF files directly in your browser. 100% Private & Free.</p>
  </header>

  <main class="max-w-4xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
    
    <!-- Compression Level Slider -->
    <div class="bg-slate-900 p-5 rounded-xl border border-slate-700">
      <div class="flex justify-between items-center mb-2">
        <label for="compressionSlider" class="font-semibold text-slate-200">
          Target Compression Ratio: <span id="percentLabel" class="text-indigo-400 font-bold">50%</span>
        </label>
        <span class="text-xs text-slate-400">Higher % = Smaller file size</span>
      </div>
      <input type="range" id="compressionSlider" min="10" max="90" value="50" step="5"
        class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
      <div class="flex justify-between text-xs text-slate-500 mt-1">
        <span>10% (Maximum Quality)</span>
        <span>50% (Balanced)</span>
        <span>90% (Maximum Compression)</span>
      </div>
    </div>

    <!-- Drop Zone -->
    <div id="dropZone" 
      class="border-2 border-dashed border-indigo-500/50 hover:border-indigo-400 bg-slate-900/50 hover:bg-slate-900 transition-all rounded-xl p-8 text-center cursor-pointer flex flex-col items-center justify-center space-y-3">
      <svg class="w-12 h-12 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
      </svg>
      <p class="text-slate-300 font-medium">Drag & Drop files here or <span class="text-indigo-400 underline">Browse</span></p>
      <p class="text-xs text-slate-500">Supports JPG, PNG, JPEG, and PDF</p>
      <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.pdf" class="hidden">
    </div>

    <!-- Action Bar -->
    <div class="flex justify-between items-center pt-2">
      <button id="compressBtn" disabled 
        class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold px-6 py-2.5 rounded-lg transition-all">
        Compress Files
      </button>
      <button id="downloadZipBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-lg transition-all">
        Download All as ZIP
      </button>
    </div>

    <!-- Output List -->
    <div id="fileList" class="space-y-3 mt-4"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
