<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Compressor Created By Ali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">

  <header class="max-w-4xl w-full text-center my-8">
    <h1 class="text-4xl font-extrabold text-indigo-400 mb-2">Online Compressor Created By Ali</h1>
    <p class="text-slate-400">Drag files to compress. Adjust the slider for each file to hit your exact target size.</p>
  </header>

  <main class="max-w-4xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
    
    <!-- Drop Zone -->
    <div id="dropZone" 
      class="border-2 border-dashed border-indigo-500/50 hover:border-indigo-400 bg-slate-900/50 hover:bg-slate-900 transition-all rounded-xl p-8 text-center cursor-pointer flex flex-col items-center justify-center space-y-3">
      <svg class="w-12 h-12 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
      </svg>
      <p class="text-slate-300 font-medium">Drag & Drop files here or <span class="text-indigo-400 underline">Browse</span></p>
      <p class="text-xs text-slate-500">Supports JPG, PNG, JPEG, and PDF</p>
      <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.pdf" class="hidden">
    </div>

    <!-- Action Bar -->
    <div class="flex justify-end pt-2">
      <button id="downloadZipBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-lg transition-all shadow-lg shadow-emerald-900/20">
        Download All as ZIP
      </button>
    </div>

    <!-- Dynamic Output List -->
    <div id="fileList" class="space-y-4 mt-4"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
